AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Vellocity MCP — serverless deploy via AWS Lambda Web Adapter (container image)
  + Lambda Function URL in RESPONSE_STREAM mode. Runs the Express/MCP server
  unchanged; streaming supports the MCP StreamableHTTP transport (serverless-http
  + API Gateway could not). Tier-1 (Bedrock + DynamoDB) scaffold present, gated.

Parameters:
  Mode:
    Type: String
    Default: thin
    AllowedValues: [thin, thick]
    Description: thin = prompt assembly (no inference, free sample); thick = Bedrock.
  McpToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: Bearer token for /mcp. Empty = open sample tier (the Marketplace trial surface).

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Architectures: [arm64]   # build the image arm64 (cheaper per ms)

Resources:
  McpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ../
      DockerTag: v1
    Properties:
      PackageType: Image
      Environment:
        Variables:
          GTM_MCP_MODE: !Ref Mode
          GTM_MCP_TOKEN: !Ref McpToken
          TENANT_TABLE: !Ref TenantTable
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref TenantTable }
        # --- Tier-1 (thick) only: least-privilege Bedrock invoke. Pin model ARNs.
        # - Statement:
        #     - Effect: Allow
        #       Action: [bedrock:InvokeModel, bedrock:Converse]
        #       Resource: [arn:aws:bedrock:*::foundation-model/anthropic.claude-*]
      FunctionUrlConfig:
        AuthType: NONE            # open free sample; app-layer bearer gates paid tiers
        InvokeMode: RESPONSE_STREAM

  # Tenant state for Tier-1: hashed API key -> tier, rate-limit counters, spend.
  # PAY_PER_REQUEST = no idle cost. Holds NO tenant business data (pulled live).
  TenantTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: tenantKeyHash, AttributeType: S }
      KeySchema:
        - { AttributeName: tenantKeyHash, KeyType: HASH }
      SSESpecification: { SSEEnabled: true }

Outputs:
  FunctionUrl:
    Description: Public MCP endpoint base — append /health and /mcp
    Value: !GetAtt McpFunctionUrl.FunctionUrl
  FunctionName:
    Value: !Ref McpFunction
